<div class="user-page-container">
  <h2 class="page-title">👥 User Management</h2>

  <!-- 🔄 Loader -->
  <div *ngIf="loading" class="loading-text">Loading users...</div>

  <!-- 🧾 User Grid -->
  <div class="user-grid" *ngIf="!loading">
    <div *ngFor="let user of users" class="user-card">
      <div class="avatar-ring">
        <img [src]="photoUrl + user.imagePath" alt="User Image" />
      </div>

      <h3>{{ user.name }}</h3>
      <p class="role">{{ user.role }}</p>
      <p class="mobile">📱 {{ user.mobileNumber }}</p>
      <p class="factory">🏭 {{ user.factoryName }}</p>

      <button (click)="startEdit(user)" class="edit-btn">✏️ Edit</button>
    </div>
  </div>

  <!-- ✏️ Edit Modal -->
  <div *ngIf="editMode" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" (click)="cancelEdit()">✖</button>
      <h3 class="modal-title">Edit User</h3>

      <form [formGroup]="userForm" (ngSubmit)="updateUser()">
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input formControlName="name" class="form-input" />
          </div>
          <div>
            <label>Role</label>
            <input formControlName="role" class="form-input" />
          </div>
          <div>
            <label>Mobile</label>
            <input formControlName="mobileNumber" class="form-input" />
          </div>
          <div>
            <label>Factory</label>
            <input formControlName="factoryName" class="form-input" />
          </div>
          <div class="col-span-2">
            <label>Address</label>
            <input formControlName="address" class="form-input" />
          </div>
          <div>
            <label>Aadhaar</label>
            <input formControlName="aadhaar" class="form-input" />
          </div>
          <div>
            <label>PAN</label>
            <input formControlName="panCard" class="form-input" />
          </div>
          <div>
            <label>New Password</label>
            <input type="password" formControlName="password" class="form-input" />
          </div>
          <div>
            <label>Change Image</label>
            <input type="file" (change)="onFileChange($event)" />
          </div>
        </div>

        <!-- 🖼️ Image Preview -->
        <div class="image-preview" *ngIf="previewImage">
          <div class="avatar-ring preview">
            <img [src]="previewImage" alt="Preview Image" />
          </div>
        </div>

        <div class="actions">
          <button type="button" (click)="cancelEdit()" class="cancel-btn">Cancel</button>
          <button type="submit" [disabled]="userForm.invalid" class="save-btn">💾 Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
