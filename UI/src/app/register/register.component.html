<div class="add-user-container">
  <div class="form-card">
    <h2 class="title">Add New User</h2>

    <form [formGroup]="userForm" (ngSubmit)="submitForm()" enctype="multipart/form-data">
      <div class="grid-container">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="Name" />
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" formControlName="Address" />
        </div>

        <div class="form-group">
          <label>Aadhaar Number</label>
          <input type="text" maxlength="12" formControlName="Aadhaar" />
        </div>

        <div class="form-group">
          <label>PAN Card</label>
          <input type="text" maxlength="10" formControlName="PanCard" />
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" maxlength="10" formControlName="MobileNumber" />
        </div>

        <div class="form-group">
          <label>Designation</label>
          <select formControlName="Role">
            <option value="">Select Role</option>
           
            <option value="Admin">Admin</option>
            <option value="supervisor">supervisor</option>
          </select>
        </div>

        <div class="form-group">
          <label>Factory Name</label>
          <input type="text" formControlName="FactoryName" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="Password" />
        </div>

        <div class="form-group image-upload">
          <label>Profile Image</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
          <div class="preview" *ngIf="previewUrl">
            <img [src]="previewUrl" alt="Preview" />
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      Add User
      </button>
    </form>
  </div>
</div>
