<div class="container py-4 factory-container">

  <!-- 🔹 Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-semibold text-primary">
      <i class="bi bi-building-gear me-2"></i> Factory Details
    </h4>
    <div class="d-flex align-items-center gap-2">
      <input
        type="text"
        placeholder="Search factory..."
        [(ngModel)]="searchTerm"
        (input)="filterData()"
        class="form-control form-control-sm"
        style="max-width: 250px;"
      />
      <button class="btn btn-primary btn-sm" (click)="addNew()">
        <i class="bi bi-plus-circle me-1"></i> Add Factory
      </button>
    </div>
  </div>

  <!-- 🔹 Loader -->
  <div *ngIf="loading" class="text-center py-4 text-muted">
    <i class="fa fa-spinner fa-spin"></i> Loading factory data...
  </div>

  <!-- 🔹 Factory Table -->
  <div *ngIf="!loading && filteredList.length; else noData">
    <div class="table-wrapper">
      <table class="table table-hover align-middle text-center">
        <thead class="table-primary">
          <tr>
            <th>#</th>
            <th>Factory Name</th>
            <th>Description</th>
            <th>customerName</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of filteredList; let i = index">
            <td>{{ i + 1 }}</td>
            <td class="fw-semibold">{{ f.factoryName}}</td>
            <td>{{ f.description || '-'  }}</td>
            <td>{{ f.customerName || '-' }}</td>
            <td>
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-outline-primary btn-sm" (click)="editItem(f)">
                  <i class="bi bi-pencil"></i>
                </button>
                <!-- <button class="btn btn-outline-danger btn-sm" (click)="deleteItem(f.factorydetailsID)">
                  <i class="bi bi-trash"></i>
                </button> -->
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 🔹 No Data Template -->
  <ng-template #noData>
    <div class="text-center text-muted py-4">
      No factory records found.
    </div>
  </ng-template>

  <!-- 🔹 Add/Edit Modal -->
  <div *ngIf="selected" class="custom-modal-backdrop">
    <div class="custom-modal-content large">
      <h5 class="text-primary fw-semibold mb-3">
        <i class="bi bi-gear me-2"></i>
        {{ selected.factorydetailsID ? 'Edit Factory' : 'Add Factory' }}
      </h5>

      <div class="row g-3">
        <div class="col-md-6" *ngFor="let field of fieldList">
          <label class="form-label">{{ field.label }}</label>
          <input
            [(ngModel)]="selected[field.key]"
            class="form-control"
            [placeholder]="field.label"
          />
        </div>
      </div>

      <div class="text-end mt-4">
        <button class="btn btn-success me-2" (click)="save()">
          <i class="bi bi-save me-1"></i> Save
        </button>
        <button class="btn btn-secondary" (click)="cancel()">
          <i class="bi bi-x-circle me-1"></i> Cancel
        </button>
      </div>
    </div>
  </div>
</div>
