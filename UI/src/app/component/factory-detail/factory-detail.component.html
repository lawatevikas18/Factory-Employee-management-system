<div class="factory-container">
  <div class="header d-flex justify-content-between align-items-center mb-3">
    <h2>🏭 Factory Details</h2>
    <div>
      <input
        type="text"
        placeholder="🔍 Search..."
        [(ngModel)]="searchTerm"
        (input)="filterData()"
        class="form-control d-inline w-auto me-2"
      />
      <button class="btn btn-primary" (click)="addNew()">
        ➕ Add Factory
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-3">
    <i class="fa fa-spinner fa-spin"></i> Loading...
  </div>

  <div *ngIf="!loading && filteredList.length">
    <table class="table table-bordered table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Factory Name</th>
          <th>Address</th>
          <th>Customer</th>
          <th>GSTIN</th>
          <th>State</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of filteredList; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ f.FactoryName }}</td>
          <td>{{ f.Address }}</td>
          <td>{{ f.CustomerName }}</td>
          <td>{{ f.GSTIN }}</td>
          <td>{{ f.State }}</td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editItem(f)">✏️</button>
            <button class="btn btn-sm btn-danger" (click)="deleteItem(f.factorydetailsID)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && !filteredList.length" class="text-center text-muted">
    No records found.
  </div>

  <!-- 🔹 Add/Edit Modal -->
  <div *ngIf="selected" class="modal-overlay">
    <div class="modal-box">
      <h4>{{ selected.factorydetailsID ? 'Edit Factory' : 'Add Factory' }}</h4>

      <div class="row g-2">
        <div class="col-md-6" *ngFor="let field of fieldList">
          <label class="form-label fw-medium">{{ field.label }}</label>
          <input
            [(ngModel)]="selected[field.key]"
            class="form-control"
            [placeholder]="field.label"
          />
        </div>
      </div>

      <div class="text-end mt-4">
        <button class="btn btn-success me-2" (click)="save()">💾 Save</button>
        <button class="btn btn-secondary" (click)="cancel()">❌ Cancel</button>
      </div>
    </div>
  </div>
</div>
