<!-- OPTION 1: Logo Above the Title (Recommended) -->
<div class="auth-wrapper">
  <div class="auth-card">
    <!-- Left Image -->
    <div class="auth-left">
      <img src="/assets/images/Nksboss.jpg" alt="Login Banner">
    </div>

    <!-- Right Form -->
    <div class="auth-right">
      <!-- Logo at the top -->
      <div class="logo-section">
        <app-network-logo [size]="100" [showText]="false" [colorScheme]="'default'"></app-network-logo>
      </div>

      <!-- <h2>{{ isLoginMode ? 'Login' : 'Register' }}</h2> -->

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <label>Mobile Number</label>
        <input type="text" formControlName="mobileNumber" placeholder="Mobile Number">
        
        <label>Password</label>
        <!-- <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password">
          <span class="toggle" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </span>
        </div> -->

        <div class="password-wrapper">
  <input 
    [type]="showPassword ? 'text' : 'password'" 
    formControlName="password" 
    placeholder="Password"
    class="password-input"
  />

  <i 
    class="toggle-icon" 
    [ngClass]="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'" 
    (click)="togglePassword()">
  </i>
</div>

           
        <button type="submit">Login</button>
      </form>

      <p class="message">{{ message }}</p>
    </div>
  </div>
</div>
